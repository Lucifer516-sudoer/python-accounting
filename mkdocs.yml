# MkDocs configuration — python-accounting documentation (SPEC Q5/Q6, D-014).
# Material for MkDocs + mkdocstrings; plugin set kept minimal so a later
# Zensical 0.1.0 switch stays cheap. Dev docs (SPEC/DECISIONS/PLAN/typing
# baseline) are committed but excluded from the built site.

site_name: python-accounting
site_description: >-
  Double-entry accounting for Python — a library, not an app.
  Ledgers, journals, reports and a hash chain that catches tampering.
site_url: https://python-accounting.readthedocs.io/en/latest/
repo_url: https://github.com/edwardotis/python-accounting
repo_name: python-accounting
copyright: Copyright &copy; 2023–2026 python-accounting contributors

theme:
  name: material
  features:
    - announce.dismiss
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - toc.follow
  palette:
    # Fluid palette: auto by day, deep ledger-green by night.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/book-open-page-variant
    repo: material/source-repository

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/fluid.js

plugins:
  - search
  - gen-files:
      scripts:
        - docs/scripts/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            docstring_section_style: table
            members_order: source
            show_source: true
            show_root_heading: true
            show_category_heading: true
            heading_level: 2
            separate_signature: true
            show_signature_annotations: false
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - toc:
      permalink: true

# Dev docs live in docs/ but are deliberately not in the nav (D-014).
exclude_docs: |
  SPEC.md
  DECISIONS.md
  PLAN.md
  typing-baseline.md
  conf.py
  requirements.txt
  Makefile
  make.bat
  index.rst

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Learn:
      - learn/index.md
      - Entities & Sessions: learn/01-entities-and-sessions.md
      - Accounts: learn/02-accounts.md
      - Transactions: learn/03-transactions.md
      - Taxes: learn/04-taxes.md
      - Clearing & Assignment: learn/05-clearing-and-assignment.md
      - Reports: learn/06-reports.md
  - Guides:
      - guides/index.md
      - Examples: guides/examples.md
      - Tax Inclusive Transactions: guides/tax-inclusive.md
      - Compound Transactions: guides/compound-transactions.md
      - Account Statement: guides/account-statement.md
      - Account Schedule: guides/account-schedule.md
      - Aging Schedule: guides/aging-schedule.md
      - Income Statement: guides/income-statement.md
      - Balance Sheet: guides/balance-sheet.md
      - Cashflow Statement: guides/cashflow-statement.md
      - Trial Balance: guides/trial-balance.md
  - Explanation:
      - explanation/index.md
      - The ledger hash chain: explanation/ledger-hashing.md
      - Recycling: explanation/recycling.md
      - Entity isolation: explanation/entity-isolation.md
      - Reporting periods: explanation/reporting-periods.md
  - API reference:
      - reference/index.md
      - API Reference: reference/SUMMARY.md
