# This workflow installs dependencies with uv and runs the test suite on a
# single version of Python.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --python 3.12 --group test --group lint
      - name: Check formatting with ruff
        run: uv run --python 3.12 ruff format --check .
      - name: Lint with ruff
        run: uv run --python 3.12 ruff check
      - name: Test with pytest
        run: uv run --python 3.12 pytest -v
