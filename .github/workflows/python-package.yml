# This workflow installs dependencies with uv, then runs the same gate that the
# pre-commit hook enforces locally.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  # Manual trigger, so CI can be re-run without pushing a commit, and so the
  # workflow can be exercised immediately after enabling Actions on a fork.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test --group lint
      - name: Check formatting with ruff
        run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check
      - name: Test with pytest
        run: uv run --python ${{ matrix.python-version }} pytest -v

  # The type checkers run on a single version to keep the matrix fast: mypy
  # strict over the library (A3) + relaxed over tests (A4), and pyright
  # standard over package + tests + scripts (A5). Both are pinned in the
  # `lint` dependency group, so every matrix version already has them.
  typecheck:
    name: Type check (mypy + pyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --python 3.12 --group test --group lint
      - name: Type check with mypy (strict, package)
        run: uv run --python 3.12 mypy python_accounting
      - name: Type check with mypy (tests)
        run: uv run --python 3.12 mypy tests
      - name: Type check with pyright
        run: uv run --python 3.12 pyright

  # config.toml is resolved from <package>/../config.toml at import time, so it
  # has to sit at the root of the wheel. A source checkout cannot catch a
  # regression here, so the built artifact is asserted explicitly.
  wheel-layout:
    name: Wheel layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check config.toml ships at the wheel root
        run: uv run --no-project --with . python scripts/check_wheel_layout.py

  # Layout is not enough: the wheel is installed into a clean environment and
  # exercised there, because config.toml only resolves when it sits at the root
  # of site-packages. 3.12 only -- the build job already covers 3.10-3.13 from
  # the source tree.
  wheel-smoke:
    name: Installed wheel smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the wheel
        run: uv build --wheel
      - name: Install the wheel into a clean environment
        run: |
          uv venv /tmp/smoke --python 3.12
          uv pip install --python /tmp/smoke/bin/python dist/*.whl
      - name: Smoke test the installed package
        run: /tmp/smoke/bin/python scripts/smoke_install.py

  # The mysqlclient/psycopg2 extras need system headers, so the pytest suite can
  # never touch them. This builds the same image users get and runs the driver
  # round-trip against real Postgres and MySQL servers via compose.
  docker:
    name: Docker image and database drivers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build the smoke image and check it runs as non-root
        run: |
          docker build --target smoke -t python-accounting-smoke .
          user="$(docker image inspect --format '{{.Config.User}}' python-accounting-smoke)"
          echo "image user: ${user}"
          [ -n "${user}" ] && [ "${user}" != "root" ] && [ "${user}" != "0" ]
          docker run --rm python-accounting-smoke
      - name: Run the database driver smoke tests
        run: docker compose up --build --abort-on-container-exit --exit-code-from drivers
      - name: Tear down
        if: always()
        run: docker compose down -v
