# This workflow installs dependencies with uv, then runs the same gate that the
# pre-commit hook enforces locally.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test --group lint
      - name: Lint with pylint
        run: uv run --python ${{ matrix.python-version }} pylint ./python_accounting
      - name: Test with pytest
        run: uv run --python ${{ matrix.python-version }} pytest -v

  # config.toml is resolved from <package>/../config.toml at import time, so it
  # has to sit at the root of the wheel. A source checkout cannot catch a
  # regression here, so the built artifact is asserted explicitly.
  wheel-layout:
    name: Wheel layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Check config.toml ships at the wheel root
        run: uv run --no-project --with . python scripts/check_wheel_layout.py
