name: Upload Python Package to PyPI when a Release is Created

on:
  release:
    types: [created]

jobs:
  pypi-publish:
    name: Publish release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/python-accounting
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Set up Python 3.12
        run: uv python install 3.12
      - name: Build package
        run: |
          uv sync --python 3.12
          uv build
      # Publishes with the long-lived PYPI_API_TOKEN. The workflow previously also
      # granted `id-token: write`, which was misleading: with `password` set the
      # action uses the token and never performs the OIDC exchange, so the
      # permission did nothing. To move to trusted publishing instead, configure
      # the publisher on PyPI, then drop `password:` and grant `id-token: write`.
      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
