[project]
name = "python-accounting"
version = "1.0.1"
description = "The world's most comprehensive python Double Entry Accounting Library"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Edward Mungai", email = "emungai@microbooks.io" }]
# Union of the former poetry spec `~3.9.0|~3.10.0|~3.11.0|~3.12.0|~3.13.0`.
requires-python = ">=3.9,<3.14"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "sqlalchemy>=2.0.23,<2.1",
    "python-dateutil>=2.8.2,<3.0",
    "strenum>=0.4.15,<0.5",
    "toml>=0.10.2,<0.11",
]

[project.urls]
Homepage = "https://github.com/Lucifer516-sudoer/python-accounting"
Repository = "https://github.com/Lucifer516-sudoer/python-accounting"
Documentation = "https://python-accounting.readthedocs.io/en/latest/"

# The database drivers are optional: the library and its test suite run entirely
# on sqlite, but both of these require system headers (libmysqlclient / libpq)
# to build. Hard-depending on them made `uv sync` fail on any machine without
# those headers, so they are opt-in extras instead.
#   pip install python-accounting[mysql]
#   pip install python-accounting[postgres]
[project.optional-dependencies]
mysql = ["mysqlclient>=2.2.4,<3.0"]
postgres = ["psycopg2>=2.9.9,<3.0"]

[dependency-groups]
test = ["pytest>=7.4.3,<8.0"]
lint = ["pylint>=3.1.0,<4.0", "pre-commit>=4.0.0,<5.0", "ruff>=0.14.10,<0.15"]
docs = [
    "sphinx-autoapi>=3.0.0,<4.0",
    "sphinx-rtd-theme>=2.0.0,<3.0",
    "sphinx>=7.2.6,<8.0",
    "myst-parser>=2.0.0,<3.0",
]
# Kept so `docs/conf.py` can pickle the sphinx environment for incremental builds.
dev = [{ include-group = "test" }, { include-group = "lint" }, "dill>=0.3.8,<0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python_accounting"]

# `config.py` resolves config.toml as `<package>/../config.toml`, i.e. from the
# *root* of site-packages. It is therefore not just package data - it must sit at
# the top level of the wheel or the installed package cannot import.
[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "config.toml"

[tool.hatch.build.targets.sdist]
include = ["/python_accounting", "/config.toml", "/tests", "/README.md", "/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Was 100 when the codebase was written to pylint's width; 88 is ruff's default
# and is what the rest of the ecosystem formats to.
line-length = 88
target-version = "py39"
extend-exclude = ["docs/_build", "dist", ".venv"]

[tool.ruff.format]
docstring-code-format = false

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    # "PL" (pylint) joins in the next commit, once the ~100 `# pylint: disable`
    # comments can be rewritten as `# noqa` in the same change that drops
    # pylint. Turning it on before then would need every live suppression to
    # carry both comment styles at once.
]
# Every entry here is a deliberate decision, not a backlog. Adding one requires
# a comment saying why.
ignore = [
    # Line length is owned by `ruff format`; E501 only ever fires on strings,
    # comments and URLs that the formatter cannot split.
    "E501",
    # NEVER re-enable this. `== None` is load-bearing SQLAlchemy here: the
    # soft-delete filter in database/event_listeners.py is the literal
    # expression `cls.deleted_at == None`. On an instrumented attribute
    # SQLAlchemy overloads `__eq__` so `== None` renders as `IS NULL`, whereas
    # `is None` is an ordinary Python identity test that renders as
    # `WHERE false`. "Fixing" these sites would silently hide every row.
    "E711",
    # This codebase names the first parameter `cls` consistently, including
    # for plain instance methods reached through a mixin.
    "N805",
    # AccountingExeption (sic) is a public-API spelling. Renaming it would
    # break every import; it needs a major release, not a lint run.
    "N818",
    # Import order is load-bearing in this package and cannot be sorted.
    # python_accounting/models/__init__.py must import .base before .account:
    # account.py, assignment.py and balance.py all do
    # `from python_accounting.models import Base`, so `Base` has to be bound in
    # the package namespace before those submodules execute. Alphabetically,
    # .account sorts first, and the package stops importing at all.
    #
    # The general hazard is wider than that one file: the package's import
    # graph is deliberately circular (see the PLC0415 suppression below and
    # the quoted relationship targets in models/), so a reordering that is fine
    # in isolation can break an import path the tests do not exercise.
    # Re-enable I001 only once the import graph is demonstrably acyclic.
    "I001",
]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship targets and `Mapped["X"]` annotations by
# name at mapper-configuration time. The names are quoted precisely so these
# modules do not import each other; importing them for real creates a cycle
# and breaks the package, which is why F821 cannot be fixed here.
"python_accounting/models/*.py" = ["F821"]
"python_accounting/mixins/*.py" = ["F821"]
"python_accounting/database/session_overrides.py" = ["F821"]
# The old gate was `pylint ./python_accounting`, so the test suite has never
# been held to the complexity limits. Long linear test bodies and wide helper
# signatures are idiomatic in tests; every other rule still applies there, and
# the library above stays under these limits.
"tests/*.py" = ["PLR0912", "PLR0913", "PLR0915"]

[tool.pylint.main]
init-hook = 'import sys; sys.path.append(".")'
