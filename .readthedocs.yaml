# .readthedocs.yaml — Read the Docs build configuration.
# Migrated from Sphinx to MkDocs as part of the 2.0 docs remodel (D-014).

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

mkdocs:
  configuration: mkdocs.yml

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs
