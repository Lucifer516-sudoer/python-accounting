# Run `uvx pre-commit install` once after cloning (or `uv run pre-commit install`).
# The ruff + pytest hooks are the same gate CI enforces, so a red commit is
# impossible to merge. See AGENTS.md for the full command list.
default_install_hook_types: [pre-commit]

exclude: |
  (?x)^(
    docs/_build/.*|
    dist/.*|
    \.venv/.*|
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key
      - id: debug-statements

  - repo: local
    hooks:
      # ruff and pytest are whole-project checks, not per-file checks, so they
      # run on every commit regardless of what is staged. `require_serial` keeps
      # them from fighting over the same .venv.
      #
      # `ruff format` runs in --check mode and deliberately does NOT fix: a
      # silent reformat inside a commit is how the isort reordering that broke
      # package import order got in. Make the reformat a separate, visible step.
      - id: ruff-format
        name: ruff format (CI gate)
        entry: uv run ruff format --check --diff .
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

      - id: ruff-check
        name: ruff check (CI gate)
        entry: uv run ruff check
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        require_serial: true
        types: [python]

      # `uv.lock` must stay in sync with pyproject.toml, and the built wheel must
      # keep shipping config.toml at its root (config.py resolves it as
      # <package>/../config.toml at import time).
      - id: uv-lock-check
        name: uv lock is up to date
        entry: uv lock --check
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|uv\.lock)$

      - id: wheel-layout
        name: wheel ships config.toml at root
        entry: uv run python scripts/check_wheel_layout.py
        language: system
        pass_filenames: false
        files: ^(pyproject\.toml|config\.toml|scripts/check_wheel_layout\.py)$
